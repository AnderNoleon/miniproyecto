services:
  nginx:
    build: .
    container_name: url-nginx
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./backend
    container_name: url-backend
    environment:
      PGHOST: url-pg
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: pgpassword
      PGDATABASE: postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    container_name: url-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: pgpassword
    volumes:
      - url-pg-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

  adminer:
    image: adminer
    container_name: url-adminer
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  url-pg-data:
