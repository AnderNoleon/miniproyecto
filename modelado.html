<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dinámico - Análisis de Defectos en Teléfonos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .kpi-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .kpi-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .kpi-variacion {
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
        }

        .variacion-a { background: linear-gradient(135deg, #ff6b6b, #ee5253); }
        .variacion-b { background: linear-gradient(135deg, #4ecdc4, #45b7af); }
        .variacion-c { background: linear-gradient(135deg, #feca57, #ff9f43); }

        .kpi-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .stat-value.good { color: #10ac84; }
        .stat-value.warning { color: #ff9f43; }
        .stat-value.bad { color: #ee5253; }

        .progress-container {
            margin: 20px 0;
        }

        .progress-bar {
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin: 5px 0;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .progress-fill.good { background: linear-gradient(90deg, #10ac84, #1dd1a1); }
        .progress-fill.warning { background: linear-gradient(90deg, #ff9f43, #feca57); }
        .progress-fill.bad { background: linear-gradient(90deg, #ee5253, #ff6b6b); }

        .kpi-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .defect-list {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .defect-type {
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .defect-hardware { background: #ff6b6b; color: white; }
        .defect-software { background: #4ecdc4; color: white; }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .kpi-message {
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            color: white;
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 KPI Dinámico - Análisis de Defectos</h1>

        <div class="kpi-container" id="kpiCards"></div>

        <button class="refresh-btn" onclick="actualizarKPIs()">
            🔄 Actualizar Datos Aleatorios
        </button>

        <div class="defect-list">
            <h2>📋 Detalle de Defectos por Teléfono</h2>
            <div style="overflow-x: auto;">
                <table id="defectTable">
                    <thead>
                        <tr>
                            <th>Phone ID</th>
                            <th>Modelo</th>
                            <th>Tipo de Defecto</th>
                            <th>Categoría</th>
                            <th>Variación</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody id="defectTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="footer">
            <p>KPI Dinámico - Máximo 10 errores por teléfono | Actualización aleatoria cada vez</p>
        </div>
    </div>

    <script>
        // Datos base de defectos
        const defectosBase = [
            { phone_id: 1, modelo: "iPhone 15 Pro", tipo_defecto: "sobrecalentamiento", categoria: "software" },
            { phone_id: 1, modelo: "iPhone 15 Pro", tipo_defecto: "drenaje de batería", categoria: "software" },
            { phone_id: 1, modelo: "iPhone 15 Pro", tipo_defecto: "calentamiento al cargar", categoria: "hardware" },
            { phone_id: 1, modelo: "iPhone 15 Pro", tipo_defecto: "consumo alto apps", categoria: "software" },
            { phone_id: 2, modelo: "Galaxy S24", tipo_defecto: "pantalla grainy", categoria: "hardware" },
            { phone_id: 2, modelo: "Galaxy S24", tipo_defecto: "líneas pantalla", categoria: "hardware" },
            { phone_id: 2, modelo: "Galaxy S24", tipo_defecto: "lag al desplazarse", categoria: "software" },
            { phone_id: 2, modelo: "Galaxy S24", tipo_defecto: "cámara se congela", categoria: "software" },
            { phone_id: 2, modelo: "Galaxy S24", tipo_defecto: "sobrecalentamiento", categoria: "hardware" },
            { phone_id: 3, modelo: "Pixel 8 Pro", tipo_defecto: "línea vertical pantalla", categoria: "hardware" },
            { phone_id: 3, modelo: "Pixel 8 Pro", tipo_defecto: "flickering pantalla", categoria: "hardware" },
            { phone_id: 3, modelo: "Pixel 8 Pro", tipo_defecto: "vulnerabilidad app preinstalada", categoria: "software" },
            { phone_id: 3, modelo: "Pixel 8 Pro", tipo_defecto: "consumo batería", categoria: "software" }
        ];

        const configuracionBase = [
            { phone_id: 1, modelo: "iPhone 15 Pro", variacion: "A", variacion_porcentaje: 20, max_errores: 10 },
            { phone_id: 2, modelo: "Galaxy S24", variacion: "B", variacion_porcentaje: 25, max_errores: 10 },
            { phone_id: 3, modelo: "Pixel 8 Pro", variacion: "C", variacion_porcentaje: 18, max_errores: 10 }
        ];

        // Función para generar errores aleatorios
        function generarErroresAleatorios() {
            const erroresAleatorios = [];
            
            configuracionBase.forEach(config => {
                // Generar entre 1 y 10 errores aleatorios para cada teléfono
                const numErrores = Math.floor(Math.random() * 10) + 1;
                
                // Filtrar defectos base para este teléfono
                const defectosBaseTelefono = defectosBase.filter(d => d.phone_id === config.phone_id);
                
                for (let i = 0; i < numErrores; i++) {
                    // Seleccionar un defecto aleatorio de la base
                    const defectoBase = defectosBaseTelefono[Math.floor(Math.random() * defectosBaseTelefono.length)];
                    
                    // Crear variaciones de defectos para hacer los datos más dinámicos
                    const variacionesDefectos = {
                        1: [
                            "sobrecalentamiento extremo",
                            "batería se descarga rápido",
                            "reinicios inesperados",
                            "cámara con retraso",
                            "apps se cierran solas",
                            "wifi inestable",
                            "bluetooth se desconecta",
                            "pantalla táctil no responde"
                        ],
                        2: [
                            "pantalla con manchas",
                            "altavoz distorsionado",
                            "micrófono no funciona",
                            "sensor de huellas falla",
                            "carga inalámbrica intermitente",
                            "GPS impreciso",
                            "notificaciones con retraso",
                            "modo noche no funciona"
                        ],
                        3: [
                            "actualización falla",
                            "reconocimiento facial no funciona",
                            "apps preinstaladas con bugs",
                            "modo ahorro no activa",
                            "sensor de luz no calibra",
                            "brillo automático falla",
                            "gestos no responden",
                            "multitarea con lag"
                        ]
                    };
                    
                    // 50% de probabilidad de usar un defecto base o una variación
                    let tipoDefecto;
                    if (Math.random() > 0.5) {
                        tipoDefecto = defectoBase.tipo_defecto;
                    } else {
                        const variaciones = variacionesDefectos[config.phone_id] || variacionesDefectos[1];
                        tipoDefecto = variaciones[Math.floor(Math.random() * variaciones.length)];
                    }
                    
                    // Determinar categoría (70% basado en base, 30% aleatorio)
                    let categoria;
                    if (Math.random() > 0.3) {
                        categoria = defectoBase.categoria;
                    } else {
                        categoria = Math.random() > 0.5 ? "hardware" : "software";
                    }
                    
                    erroresAleatorios.push({
                        phone_id: config.phone_id,
                        modelo: config.modelo,
                        tipo_defecto: tipoDefecto,
                        categoria: categoria
                    });
                }
            });
            
            return erroresAleatorios;
        }

        // Función para calcular KPIs
        function calcularKPIs(errores) {
            const kpis = [];
            
            configuracionBase.forEach(config => {
                const erroresTelefono = errores.filter(e => e.phone_id === config.phone_id);
                const numErrores = erroresTelefono.length;
                const porcentajeOcupado = (numErrores / config.max_errores) * 100;
                
                // Calcular KPI basado en el porcentaje de errores
                let estado = "good";
                let mensaje = "";
                
                if (porcentajeOcupado <= 30) {
                    estado = "good";
                    mensaje = "✅ Excelente - Muy por debajo del límite";
                } else if (porcentajeOcupado <= 60) {
                    estado = "warning";
                    mensaje = "⚠️ Atención - Acercándose al límite";
                } else {
                    estado = "bad";
                    mensaje = "❌ Crítico - Cerca del máximo permitido";
                }
                
                kpis.push({
                    ...config,
                    errores_observados: numErrores,
                    porcentaje_ocupado: porcentajeOcupado.toFixed(1),
                    estado: estado,
                    mensaje: mensaje,
                    defectos: erroresTelefono
                });
            });
            
            return kpis;
        }

        // Función para renderizar KPIs
        function renderizarKPIs(kpis) {
            const container = document.getElementById('kpiCards');
            container.innerHTML = '';
            
            kpis.forEach(kpi => {
                const colores = {
                    A: 'variacion-a',
                    B: 'variacion-b',
                    C: 'variacion-c'
                };
                
                const card = document.createElement('div');
                card.className = 'kpi-card';
                
                card.innerHTML = `
                    <div class="kpi-header">
                        <span class="kpi-title">${kpi.modelo}</span>
                        <span class="kpi-variacion ${colores[kpi.variacion]}">${kpi.variacion} ${kpi.variacion_porcentaje}%</span>
                    </div>
                    
                    <div class="kpi-stats">
                        <div class="stat">
                            <div class="stat-label">Errores Observados</div>
                            <div class="stat-value ${kpi.estado}">${kpi.errores_observados}</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Máximo Permitido</div>
                            <div class="stat-value">${kpi.max_errores}</div>
                        </div>
                    </div>
                    
                    <div class="progress-container">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Porcentaje Ocupado</span>
                            <span>${kpi.porcentaje_ocupado}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill ${kpi.estado}" style="width: ${Math.min(kpi.porcentaje_ocupado, 100)}%"></div>
                        </div>
                    </div>
                    
                    <div class="kpi-message" style="background: ${kpi.estado === 'good' ? '#d4edda' : kpi.estado === 'warning' ? '#fff3cd' : '#f8d7da'}; color: ${kpi.estado === 'good' ? '#155724' : kpi.estado === 'warning' ? '#856404' : '#721c24'}">
                        ${kpi.mensaje}
                    </div>
                    
                    <div class="kpi-footer">
                        <span>🔧 HW: ${kpi.defectos.filter(d => d.categoria === 'hardware').length}</span>
                        <span>💻 SW: ${kpi.defectos.filter(d => d.categoria === 'software').length}</span>
                        <span>📊 Total: ${kpi.errores_observados}</span>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Función para renderizar tabla de defectos
        function renderizarTabla(errores, kpis) {
            const tbody = document.getElementById('defectTableBody');
            tbody.innerHTML = '';
            
            // Crear un mapa para acceder rápidamente a la variación de cada teléfono
            const variacionMap = {};
            kpis.forEach(kpi => {
                variacionMap[kpi.phone_id] = { variacion: kpi.variacion, porcentaje: kpi.variacion_porcentaje };
            });
            
            errores.forEach(error => {
                const row = document.createElement('tr');
                const variacion = variacionMap[error.phone_id] || { variacion: '-', porcentaje: '-' };
                
                row.innerHTML = `
                    <td>${error.phone_id}</td>
                    <td><strong>${error.modelo}</strong></td>
                    <td>${error.tipo_defecto}</td>
                    <td><span class="defect-type ${error.categoria === 'hardware' ? 'defect-hardware' : 'defect-software'}">${error.categoria}</span></td>
                    <td>${variacion.variacion}</td>
                    <td>${variacion.porcentaje}%</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Función principal para actualizar todo
        function actualizarKPIs() {
            const erroresAleatorios = generarErroresAleatorios();
            const kpis = calcularKPIs(erroresAleatorios);
            
            renderizarKPIs(kpis);
            renderizarTabla(erroresAleatorios, kpis);
        }

        // Inicializar con datos base
        actualizarKPIs();
    </script>
</body>
</html>
